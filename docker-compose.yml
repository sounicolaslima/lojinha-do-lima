version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: lojinha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lojinha
      POSTGRES_PASSWORD: lojinha123
      POSTGRES_DB: lojinha
    ports:
      - '5432:5432'
    volumes:
      - lojinha_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lojinha']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lojinha_data: